  <!-- SHARED CLIENT UTILITIES (Dimuat sebelum view modular agar siap digunakan) -->
  <script>
    function hasGoogleScriptRun() {
      return typeof google !== "undefined" && google.script && google.script.run;
    }

    function switchFeatureMode(mode) {
      var viewParser = document.getElementById("viewParser");
      var viewHpp = document.getElementById("viewHppAudit");
      var viewReplace = document.getElementById("viewReplaceHpp");
      var viewScanner = document.getElementById("viewScanner");
      var viewCiamsoPem = document.getElementById("viewCiamsoPembanding");
      var viewReplaceData = document.getElementById("viewReplaceData");
      var featureSelect = document.getElementById("featureSelect");
      var subtitle = document.getElementById("headerSubtitle");

      if (featureSelect && featureSelect.value !== mode) {
        featureSelect.value = mode;
      }

      if (viewParser) viewParser.classList.add("hidden");
      if (viewHpp) viewHpp.classList.add("hidden");
      if (viewReplace) viewReplace.classList.add("hidden");
      if (viewScanner) viewScanner.classList.add("hidden");
      if (viewCiamsoPem) viewCiamsoPem.classList.add("hidden");
      if (viewReplaceData) viewReplaceData.classList.add("hidden");

      if (mode === "parser") {
        if (viewParser) viewParser.classList.remove("hidden");
        if (subtitle) subtitle.textContent = "Mode: 01. Parser (Sheet Range → JSON)";
      } else if (mode === "replace-hpp") {
        if (viewReplace) viewReplace.classList.remove("hidden");
        if (subtitle) subtitle.textContent = "Mode: 03. Replace Harga HPP Central (Preview & Apply ke Sheet)";
        if (typeof initReplaceHppView === "function") {
          initReplaceHppView();
        }
      } else if (mode === "scanner") {
        if (viewScanner) viewScanner.classList.remove("hidden");
        if (subtitle) subtitle.textContent = "Mode: 04. Scanner Sheet (Central Storage & Kitchen Live Scan)";
        if (typeof initScannerView === "function") {
          initScannerView();
        }
      } else if (mode === "ciamso-pembanding") {
        if (viewCiamsoPem) viewCiamsoPem.classList.remove("hidden");
        if (subtitle) subtitle.textContent = "Mode: 05. Pembanding HPP Ciamso (2 Warna & Auto Create Tabel)";
        if (typeof initCiamsoPembandingView === "function") {
          initCiamsoPembandingView();
        }
      } else if (mode === "ciamso-replace") {
        if (viewReplaceData) viewReplaceData.classList.remove("hidden");
        if (subtitle) subtitle.textContent = "Mode: 06. Replace Data (Replace All Bahan di Seluruh Sheet)";
        if (typeof initReplaceDataView === "function") {
          initReplaceDataView();
        }
      } else {
        if (viewHpp) viewHpp.classList.remove("hidden");
        if (subtitle) subtitle.textContent = "2 Warna (Hijau & Merah) di 2 Kolom Terakhir + Kolom Note";
      }
    }

    function normalizeKey(txt) {
      return String(txt || "").toLowerCase().replace(/[^a-z0-9]/g, "");
    }

    function parseNum(val) {
      if (val === null || val === undefined || val === "") return null;
      if (typeof val === "number" && !isNaN(val)) return val;
      var s = String(val).trim();
      if (!s) return null;
      var cleaned = s
        .replace(/[Rp\s]/gi, "")
        .replace(/\.(?=\d{3}(\D|$))/g, "")
        .replace(",", ".");
      var n = Number(cleaned);
      return isFinite(n) ? n : null;
    }

    function formatIDR(val, allowDecimals) {
      if (val === null || val === undefined || isNaN(val)) return "-";
      if (allowDecimals && Math.abs(val - Math.round(val)) > 0.005) {
        return new Intl.NumberFormat("id-ID", { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(val);
      }
      return new Intl.NumberFormat("id-ID").format(Math.round(val));
    }

    function formatSignedIDR(val, allowDecimals) {
      if (val === null || val === undefined || isNaN(val)) return "-";
      if (allowDecimals && Math.abs(val - Math.round(val)) > 0.005) {
        if (Math.abs(val) < 0.005) return "0";
        return (val > 0 ? "+" : "") + new Intl.NumberFormat("id-ID", { minimumFractionDigits: 0, maximumFractionDigits: 2 }).format(val);
      }
      var r = Math.round(val);
      if (r === 0) return "0";
      return (r > 0 ? "+" : "") + new Intl.NumberFormat("id-ID").format(r);
    }

    function escapeHtml(str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    }

    function colNumberToLetter(colNum) {
      var temp = Number(colNum);
      var letter = "";
      while (temp > 0) {
        var mod = (temp - 1) % 26;
        letter = String.fromCharCode(65 + mod) + letter;
        temp = Math.floor((temp - 1) / 26);
      }
      return letter || "A";
    }

    function showAuditStatus(type, text) {
      var box = document.getElementById("auditStatusBox");
      if (!box) return;

      if (!text) {
        box.className = "hidden";
        box.textContent = "";
        return;
      }

      var cls = "rounded-md p-2.5 text-xs border ";
      if (type === "success") {
        cls += "bg-emerald-50 border-emerald-300 text-emerald-800";
      } else if (type === "error") {
        cls += "bg-rose-50 border-rose-300 text-rose-800";
      } else {
        cls += "bg-sky-50 border-sky-300 text-sky-800";
      }

      box.className = cls;
      box.textContent = text;
    }
  </script>
