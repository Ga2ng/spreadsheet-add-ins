<!--
===============================================================================
MENU 01: PARSER VIEW (ParserView.html)
===============================================================================
Fungsi: Membaca range sheet aktif dan mengekspornya menjadi format JSON bersih.
===============================================================================
-->
<div id="viewParser" class="hidden space-y-3">

  <!-- Selected Range -->
  <section class="bg-white rounded-lg border border-slate-200 p-3.5 shadow-sm">
    <div class="flex items-center justify-between mb-2">
      <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">Selected Range</h2>
      <span id="parserRangeDim" class="hidden text-[11px] font-medium text-emerald-700 bg-emerald-50 px-2 py-0.5 rounded border border-emerald-200"></span>
    </div>

    <div id="parserRangeBox" class="bg-slate-50 border border-dashed border-slate-300 rounded-md px-3 py-3 mb-3 text-center">
      <p class="text-xs text-slate-500">
        Blok tabel Central Kitchen / Central Storage di Sheet (termasuk baris Header), lalu klik tombol di bawah.
      </p>
    </div>

    <div id="parserErrorBox" class="hidden bg-red-50 border border-red-200 text-red-700 text-xs rounded-md p-2.5 mb-3"></div>

    <button
      id="btnReadRange"
      type="button"
      onclick="handleReadSelectedRange()"
      class="w-full py-2 px-3 bg-emerald-600 hover:bg-emerald-700 active:bg-emerald-800 text-white text-xs font-semibold rounded-md shadow-sm transition-colors"
    >
      Read Selected Range
    </button>
  </section>

  <!-- Parser Options -->
  <section class="bg-white rounded-lg border border-slate-200 p-3.5 shadow-sm space-y-3">
    <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">Parser Options</h2>

    <div class="space-y-2">
      <label class="flex items-center gap-2.5 cursor-pointer select-none">
        <input id="optHasHeader" type="checkbox" checked onchange="recomputeParserPreview()" class="h-4 w-4 rounded border-slate-300 text-emerald-600" />
        <span class="text-xs font-medium text-slate-700">First row is header</span>
      </label>

      <label class="flex items-center gap-2.5 cursor-pointer select-none">
        <input id="optIgnoreEmpty" type="checkbox" checked onchange="recomputeParserPreview()" class="h-4 w-4 rounded border-slate-300 text-emerald-600" />
        <span class="text-xs text-slate-700">Ignore empty rows</span>
      </label>
    </div>

    <div class="pt-2 border-t border-slate-100">
      <div class="text-xs font-semibold text-slate-600 mb-2">JSON Structure:</div>
      <div class="space-y-1.5">
        <label class="flex items-center gap-2.5 cursor-pointer select-none">
          <input type="radio" name="parserFormat" value="objects" checked onchange="recomputeParserPreview()" class="h-4 w-4 text-emerald-600" />
          <span class="text-xs text-slate-700">Array of objects <span class="text-[11px] text-slate-400 font-mono">[{"Col": "Val"}]</span></span>
        </label>
        <label class="flex items-center gap-2.5 cursor-pointer select-none">
          <input type="radio" name="parserFormat" value="arrays" onchange="recomputeParserPreview()" class="h-4 w-4 text-emerald-600" />
          <span class="text-xs text-slate-700">Array of arrays <span class="text-[11px] text-slate-400 font-mono">[["Col"], ["Val"]]</span></span>
        </label>
      </div>
    </div>
  </section>

  <!-- Data Preview -->
  <section class="bg-white rounded-lg border border-slate-200 p-3.5 shadow-sm flex flex-col">
    <div class="flex items-center justify-between mb-2">
      <div class="flex items-center gap-1.5">
        <h2 class="text-xs font-bold uppercase tracking-wider text-slate-500">Data Preview</h2>
        <span id="parserRecordBadge" class="hidden text-[11px] font-semibold text-slate-600 bg-slate-100 px-1.5 py-0.5 rounded"></span>
      </div>
      <button type="button" onclick="handleReadSelectedRange()" class="text-[11px] font-medium text-emerald-700 hover:underline">
        Refresh Preview
      </button>
    </div>

    <div id="parserWarningsBox" class="hidden bg-amber-50 border border-amber-200 rounded-md p-2.5 mb-2.5 space-y-1"></div>

    <div id="parserPreviewContainer" class="hidden">
      <div class="flex items-center justify-between mb-1.5">
        <label class="flex items-center gap-1.5 text-[11px] text-slate-600 cursor-pointer select-none">
          <input id="optShowMeta" type="checkbox" onchange="recomputeParserPreview()" class="h-3.5 w-3.5 rounded border-slate-300 text-emerald-600" />
          <span>Show export metadata</span>
        </label>
        <div class="flex gap-1">
          <button type="button" onclick="handleUseParsedJsonAsComparator()" class="text-[11px] text-emerald-700 font-semibold hover:bg-emerald-100 px-1.5 py-0.5 rounded border border-emerald-200 bg-emerald-50">
            + Tambah ke Pembanding
          </button>
          <button id="btnCopyJson" type="button" onclick="handleCopyParserJson()" class="text-[11px] text-slate-500 hover:text-slate-800 px-1.5 py-0.5 rounded border border-slate-200 bg-slate-50">
            Copy JSON
          </button>
        </div>
      </div>
      <pre id="parserJsonPre" class="bg-slate-900 text-emerald-300 text-[11px] font-mono p-3 rounded-md overflow-auto max-h-60 leading-relaxed border border-slate-800"></pre>
    </div>

    <div id="parserEmptyPreview" class="bg-slate-50 border border-slate-200 rounded-md p-5 text-center text-xs text-slate-400">
      Belum ada data. Klik <strong class="text-slate-600">Read Selected Range</strong> terlebih dahulu.
    </div>
  </section>

  <!-- Download JSON -->
  <section class="bg-white rounded-lg border border-slate-200 p-3.5 shadow-sm space-y-2">
    <div id="parserFileNameHint" class="hidden text-[11px] text-slate-500 truncate"></div>
    <button
      id="btnDownloadJson"
      type="button"
      disabled
      onclick="handleDownloadParserJson()"
      class="w-full py-2.5 px-4 bg-slate-900 hover:bg-slate-800 disabled:bg-slate-300 disabled:text-slate-500 text-white text-xs font-semibold rounded-md shadow-sm transition-colors"
    >
      Download JSON (.json)
    </button>
  </section>

</div>

<script>
  if (typeof hasGoogleScriptRun === "undefined") {
    window.hasGoogleScriptRun = function () {
      return typeof google !== "undefined" && google.script && google.script.run;
    };
  }
  if (typeof escapeHtml === "undefined") {
    window.escapeHtml = function (str) {
      return String(str || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;");
    };
  }

  // State Parser
  var currentRangeData = null;
  var currentExportPayload = null;
  var currentSuggestedFilename = "";

  function handleReadSelectedRange() {
    var btn = document.getElementById("btnReadRange");
    var errBox = document.getElementById("parserErrorBox");
    errBox.classList.add("hidden");
    btn.textContent = "Reading Range...";
    btn.disabled = true;

    if (hasGoogleScriptRun()) {
      google.script.run
        .withSuccessHandler(function (res) {
          btn.textContent = "Read Selected Range";
          btn.disabled = false;
          currentRangeData = res;
          renderRangeInfoBox(res);
          recomputeParserPreview();
        })
        .withFailureHandler(function (err) {
          btn.textContent = "Read Selected Range";
          btn.disabled = false;
          errBox.textContent = err && err.message ? err.message : String(err);
          errBox.classList.remove("hidden");
        })
        .readSelectedRangeFromSheet();
    } else {
      btn.textContent = "Read Selected Range";
      btn.disabled = false;
      currentRangeData = {
        sheetName: "CENTRAL KITCHEN",
        address: "A1:H4",
        rowCount: 4,
        columnCount: 8,
        values: [
          ["NO", "ITEM", "KATEGORI", "GRAMASI", "PL UPDATE 11 AGUSTUS 2026", "PL CENTRAL 11 AGUSTUS 2026", "PL UPDATE 15 OKTOBER 2026", "PL CENTRAL 15 OKTOBER 2026"],
          [1, "ANGKAK", "CENTRAL KITCHEN", "GR", "Rp66", "Rp76", "", "Rp0"],
          [2, "AYAM CHARSIU", "CENTRAL KITCHEN", "PORSI", "Rp 11.635", "Rp13.380", "", "Rp0"],
          [4, "AYAM CUT 5", "CENTRAL KITCHEN", "KG", "Rp36.500", "Rp41.975", "Rp37.500", "Rp43.125"]
        ]
      };
      renderRangeInfoBox(currentRangeData);
      recomputeParserPreview();
    }
  }

  function renderRangeInfoBox(rangeData) {
    var dimBadge = document.getElementById("parserRangeDim");
    var rangeBox = document.getElementById("parserRangeBox");

    dimBadge.textContent = rangeData.rowCount + " rows × " + rangeData.columnCount + " columns";
    dimBadge.classList.remove("hidden");

    rangeBox.className = "bg-slate-50 border border-slate-200 rounded-md px-3 py-2 mb-3 text-left";
    rangeBox.innerHTML =
      '<div class="text-xs text-slate-500">Worksheet & Range</div>' +
      '<div class="text-sm font-mono font-semibold text-slate-800 break-all">' +
      escapeHtml(rangeData.sheetName + "!" + rangeData.address) +
      "</div>";
  }

  function isRowEmpty(row) {
    return row.every(function (c) {
      return c === null || c === undefined || String(c).trim() === "";
    });
  }

  function recomputeParserPreview() {
    if (!currentRangeData) return;

    var hasHeader = document.getElementById("optHasHeader").checked;
    var ignoreEmpty = document.getElementById("optIgnoreEmpty").checked;
    var showMeta = document.getElementById("optShowMeta").checked;
    var formatRadio = document.querySelector('input[name="parserFormat"]:checked');
    var format = formatRadio ? formatRadio.value : "objects";

    var rawValues = currentRangeData.values || [];
    var filteredRows = ignoreEmpty ? rawValues.filter(function (r) { return !isRowEmpty(r); }) : rawValues;

    var warnings = [];
    var parsedData = [];

    if (format === "arrays") {
      parsedData = filteredRows;
    } else if (filteredRows.length > 0) {
      var colCount = filteredRows[0].length;
      var headers = [];
      var dataRows = filteredRows;

      if (hasHeader) {
        var rawHeader = filteredRows[0];
        dataRows = filteredRows.slice(1);
        var seen = {};
        var emptyCols = [];
        var dupCols = [];

        for (var c = 0; c < colCount; c++) {
          var h = rawHeader[c] !== null && rawHeader[c] !== undefined ? String(rawHeader[c]).trim() : "";
          if (!h) {
            h = "Column_" + (c + 1);
            emptyCols.push(c + 1);
          }
          if (seen[h]) {
            seen[h] += 1;
            var uniq = h + "_" + seen[h];
            dupCols.push('"' + h + '" → "' + uniq + '"');
            headers.push(uniq);
          } else {
            seen[h] = 1;
            headers.push(h);
          }
        }

        if (emptyCols.length > 0) {
          warnings.push("Header kosong pada kolom ke-" + emptyCols.join(", ") + " (menggunakan Column_N).");
        }
        if (dupCols.length > 0) {
          warnings.push("Header duplikat disesuaikan: " + dupCols.join(", ") + ".");
        }
      } else {
        for (var k = 0; k < colCount; k++) {
          headers.push("Column_" + (k + 1));
        }
      }

      parsedData = dataRows.map(function (row) {
        var obj = {};
        for (var i = 0; i < headers.length; i++) {
          obj[headers[i]] = row[i] !== undefined ? row[i] : null;
        }
        return obj;
      });
    }

    currentExportPayload = {
      metadata: {
        tool: "Audit Data Tools",
        version: "2.4.0",
        sourceSheet: currentRangeData.sheetName,
        sourceRange: currentRangeData.address,
        rowCount: currentRangeData.rowCount,
        columnCount: currentRangeData.columnCount,
        exportedAt: new Date().toISOString(),
        hasHeader: hasHeader,
        format: format === "objects" ? "array-of-objects" : "array-of-arrays"
      },
      data: parsedData
    };

    var recordBadge = document.getElementById("parserRecordBadge");
    recordBadge.textContent = parsedData.length + " records";
    recordBadge.classList.remove("hidden");

    var warnBox = document.getElementById("parserWarningsBox");
    if (warnings.length > 0) {
      warnBox.innerHTML =
        '<div class="text-[11px] font-bold text-amber-800 uppercase">Parser Warning</div>' +
        '<ul class="list-disc list-inside text-[11px] text-amber-700 space-y-0.5">' +
        warnings.map(function (w) { return "<li>" + escapeHtml(w) + "</li>"; }).join("") +
        "</ul>";
      warnBox.classList.remove("hidden");
    } else {
      warnBox.classList.add("hidden");
    }

    document.getElementById("parserEmptyPreview").classList.add("hidden");
    document.getElementById("parserPreviewContainer").classList.remove("hidden");

    var targetPreview = showMeta ? currentExportPayload : parsedData;
    document.getElementById("parserJsonPre").textContent = JSON.stringify(targetPreview, null, 2);

    var safeSheet = String(currentRangeData.sheetName || "Sheet").replace(/[^a-zA-Z0-9_-]/g, "_");
    var safeRange = String(currentRangeData.address || "").replace(/:/g, "-").replace(/[^a-zA-Z0-9_-]/g, "");
    var now = new Date();
    var pad = function (n) { return String(n).padStart(2, "0"); };
    var ts = now.getFullYear() + pad(now.getMonth() + 1) + pad(now.getDate()) + "-" + pad(now.getHours()) + pad(now.getMinutes()) + pad(now.getSeconds());
    currentSuggestedFilename = "audit-data_" + safeSheet + "_" + safeRange + "_" + ts + ".json";

    var fnHint = document.getElementById("parserFileNameHint");
    fnHint.innerHTML = 'File: <span class="font-mono text-slate-700">' + escapeHtml(currentSuggestedFilename) + "</span>";
    fnHint.classList.remove("hidden");

    document.getElementById("btnDownloadJson").disabled = parsedData.length === 0;
  }

  function handleUseParsedJsonAsComparator() {
    if (!currentExportPayload || !Array.isArray(currentExportPayload.data)) return;
    var presetName = "Sheet " + (currentExportPayload.metadata.sourceSheet || "Inventory");
    var newPreset = {
      id: "parsed-json-" + new Date().getTime(),
      name: presetName,
      period: currentExportPayload.metadata.sourceRange || "Hasil Parser",
      defaultSelected: true,
      data: currentExportPayload.data
    };

    if (hasGoogleScriptRun()) {
      google.script.run.saveCustomReferenceJsonPreset(newPreset);
    }
    if (typeof availableJsonPresets !== "undefined") {
      availableJsonPresets.push(newPreset);
      selectedDatasetIds[newPreset.id] = true;
      if (typeof renderJsonDatasetChecklist === "function") renderJsonDatasetChecklist();
      if (typeof rebuildMergedInventoryFromSelected === "function") rebuildMergedInventoryFromSelected();
    }

    document.getElementById("featureSelect").value = "hpp-audit";
    switchFeatureMode("hpp-audit");
    showAuditStatus("success", 'Data "' + presetName + '" berhasil ditambahkan & langsung ikut dicentang sebagai pembanding!');
  }

  function handleCopyParserJson() {
    if (!currentExportPayload) return;
    var btn = document.getElementById("btnCopyJson");
    navigator.clipboard.writeText(JSON.stringify(currentExportPayload, null, 2)).then(function () {
      btn.textContent = "Copied!";
      setTimeout(function () { btn.textContent = "Copy JSON"; }, 1500);
    });
  }

  function handleDownloadParserJson() {
    if (!currentExportPayload) return;
    var jsonStr = JSON.stringify(currentExportPayload, null, 2);
    var blob = new Blob([jsonStr], { type: "application/json;charset=utf-8" });
    var url = URL.createObjectURL(blob);
    var a = document.createElement("a");
    a.href = url;
    a.download = currentSuggestedFilename || "export.json";
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    setTimeout(function () { URL.revokeObjectURL(url); }, 1000);
  }
</script>
